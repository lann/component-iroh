[package]
name = "iroh-spike-guest"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "Spike guest: one iroh-style QUIC endpoint over a WebRTC data channel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh-endpoint-core = { path = "../core" }
polymorph-tls-quinn = { path = "../.deps/tls/rust/quinn" }
quinn-proto = { version = "=0.11.16", default-features = false }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "custom-provider"] }
getrandom = "0.4"
bytes = "1"
hex = "0.4"
blake3 = { version = "1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.59", features = ["async"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
