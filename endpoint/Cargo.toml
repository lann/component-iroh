[package]
name = "iroh-endpoint"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The lann:iroh endpoint component: connect/accept by endpoint ID over the relay wire"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh-endpoint-core = { path = "../core" }
quinn-proto = { version = "=0.11.16", default-features = false }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "custom-provider"] }
getrandom = "0.4"
bytes = "1"
hex = "0.4"
blake3 = { version = "1", default-features = false }
wit-bindgen = { version = "0.59", features = ["async", "async-spawn"] }
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
lann-webcrypto-guest = { path = "../.deps/webcrypto/rust/guest" }
