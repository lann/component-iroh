[workspace]

[package]
name = "iroh-udp-wake-virt"
version = "0.0.1"
edition = "2021"
publish = false
description = "Portable virtualization layer: exports the wasi 0.2 poll/sockets surface over the host's wasi:io plus a generic event source"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.59"

[profile.release]
lto = true
opt-level = "s"
