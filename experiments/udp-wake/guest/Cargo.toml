[workspace]

[package]
name = "iroh-udp-wake-guest"
version = "0.0.1"
edition = "2021"
publish = false
description = "Probe: wake a parked tokio (wasip2, mio poll reactor) from JS via a synthetic wasi:sockets UDP shim under jco/JSPI"

# Requires RUSTFLAGS="--cfg tokio_unstable" (tokio gates `net` on wasm
# targets behind it); set by .cargo/config.toml in this directory.

[dependencies]
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "time",
    "sync",
    "macros",
    "net",
    "io-util",
] }

[profile.release]
lto = true
opt-level = "s"
