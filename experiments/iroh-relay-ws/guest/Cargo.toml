[workspace]

[package]
name = "iroh-relay-ws-guest"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike: upstream iroh (v1.0.3, unmodified) on wasm32-wasip2, relay-only, with the relay websocket bridged through polymorph-websocket via the synthetic-datagram wake pattern"

[dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
n0-error = "1"
n0-watcher = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The four wasi enablement patches (see vendor/*/): noq-udp routes wasi to
# its posix_minimal impl (socket2 send_to/recv_from — functional, not a
# stub); netwatch routes wasi to its netdev-free posix_minimal branch;
# iroh-dns tolerates the missing system resolver config; iroh-relay gains
# a wasi connect() that rides a datagram pipe instead of dialing TCP.
[patch.crates-io]
noq-udp = { path = "../vendor/noq-udp" }
netwatch = { path = "../vendor/netwatch" }
iroh-dns = { path = "../vendor/iroh-dns" }
iroh-relay = { path = "../vendor/iroh-relay" }
iroh = { path = "../vendor/iroh" }

[profile.release]
lto = true
opt-level = "s"
