[workspace]

[package]
name = "iroh-relay-ws-guest"
version = "0.0.1"
edition = "2021"
publish = false
description = "Spike: upstream iroh (main, unmodified) on wasm32-wasip2 — relay over polymorph-websocket plus WebRTC data channels as a CustomTransport, both through the synthetic-datagram wake pattern"

[dependencies]
iroh = { git = "https://github.com/n0-computer/iroh.git", rev = "735958f81e9aa5868a2118db6195b33179e33cd0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "1.0.3"
noq-udp = { version = "1.1.0", default-features = false }
n0-watcher = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "macros", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The wasi enablement patches. Released versions lag upstream too far
# (noq#773 merged but unreleased; netwatch restructured on main; iroh
# main carries relay-path fixes), so upstream comes from pinned git revs
# and the spike's own patches ride locally re-vendored copies of the
# same revs:
#
# - iroh tracks main (rev above); the git source is overridden by
#   vendor/iroh — the same rev re-vendored plus the net_report probe
#   short-circuit (home-relay selection gates on an HTTP probe no wasi
#   host can run). Its manifest's path deps pull vendor/iroh-relay
#   (wasi connect() over the datagram pipe) and vendor/iroh-dns
#   (tolerates the missing system resolver config), both also at the
#   pinned rev plus this spike's patches.
# - the noq family rides the rev carrying noq#773 (wasip2 support for
#   noq-udp; released 1.1.1 was cut from a pre-merge base, and released
#   noq requires noq-udp ^1.1.1, so the three must move together).
# - netwatch stays a vendored 0.19.1 (iroh main still requires ^0.19.1)
#   routing wasi to its netdev-free posix_minimal branch.
[patch."https://github.com/n0-computer/iroh.git"]
iroh = { path = "../vendor/iroh" }

[patch.crates-io]
noq = { git = "https://github.com/n0-computer/noq.git", rev = "f1ae90533aad86942b7fdc6562744006268989b3" }
noq-proto = { git = "https://github.com/n0-computer/noq.git", rev = "f1ae90533aad86942b7fdc6562744006268989b3" }
noq-udp = { git = "https://github.com/n0-computer/noq.git", rev = "f1ae90533aad86942b7fdc6562744006268989b3" }
netwatch = { path = "../vendor/netwatch" }

[profile.release]
lto = true
opt-level = "s"
