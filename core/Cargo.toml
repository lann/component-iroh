[package]
name = "iroh-endpoint-core"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
description = "Shared endpoint core: the webcrypto-held identity, RPK TLS configs over the lann:tls profile, and relay wire framing"

[dependencies]
# The TLS 1.3 crypto core: the lann:tls sibling's wasm-safe profile with
# QUIC packet protection and quinn session glue, all in-guest RustCrypto.
lann-tls-profile = { path = "../.deps/tls/rust/profile" }
lann-tls-quinn = { path = "../.deps/tls/rust/quinn" }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "custom-provider"] }
rustls-pki-types = "1"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.59", features = ["async"] }
lann-webcrypto-guest = { path = "../.deps/webcrypto/rust/guest" }

[dev-dependencies]
